<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Exam Countdown</title>
  <link rel="stylesheet" href="day.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1 class="title">Exam Countdown</h1>
      <p class="subtitle">Time left until each exam date</p>
    </header>

    <section class="controls">
      <div class="exam-list" role="tablist" aria-label="Exams">
        <!-- Buttons generated by JS but include fallback -->
        <button class="exam-btn" data-key="math" aria-selected="true">Mathematics<br><span class="date">May 15</span></button>
        <button class="exam-btn" data-key="science" aria-selected="false">Science<br><span class="date">May 19</span></button>
        <button class="exam-btn" data-key="social" aria-selected="false">Social Science<br><span class="date">May 22</span></button>
        <button class="exam-btn" data-key="language" aria-selected="false">Language Subject<br><span class="date">May 26</span></button>
      </div>

      <div class="toggle-row">
        <label class="toggle">
          <input id="compactToggle" type="checkbox" />
          <span class="toggle-slider"></span>
          <span class="toggle-label">Compact view</span>
        </label>
      </div>
    </section>

    <section class="countdown-card" id="countdownCard" role="region" aria-live="polite">
      <div class="exam-header">
        <h2 id="examName">Mathematics</h2>
        <div id="examDate" class="exam-date">May 15, 2026</div>
      </div>

      <div class="time-grid" id="timeGrid">
        <div class="time-item">
          <div class="number" id="days">0</div>
          <div class="label">Days</div>
        </div>
        <div class="time-item">
          <div class="number" id="hours">0</div>
          <div class="label">Hours</div>
        </div>
        <div class="time-item">
          <div class="number" id="minutes">0</div>
          <div class="label">Minutes</div>
        </div>
        <div class="time-item">
          <div class="number" id="seconds">0</div>
          <div class="label">Seconds</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label" id="progressLabel">Progress</div>
      </div>

      <div class="actions">
        <button id="remindBtn" class="btn primary">Set Reminder</button>
        <button id="copyBtn" class="btn">Copy Date</button>
      </div>
    </section>

    <footer class="footer">
      <small>Dates shown are for May 2026. Save this page for live updates.</small>
    </footer>
  </main>

  <script src="day.js"></script>
</body>
</html>
